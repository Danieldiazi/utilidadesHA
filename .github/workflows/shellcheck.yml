name: Shell validation

on:
  push:
    paths:
      - "utilidadesHA.bash"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "utilidadesHA.bash"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: bash -n utilidadesHA.bash

      - name: ShellCheck
        run: shellcheck utilidadesHA.bash
